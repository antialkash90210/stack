groups:
  - name: stack-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен более 2 минут"
          description: "Instance {{ $labels.instance }} (job {{ $labels.job }}) down."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Свободное место на диске < 15%"
          description: "Доступно {{ $value | printf \"%.1f\" }}% на {{ $labels.mountpoint }}."

      - alert: High5xxRate
        expr: |
          (
            sum(rate(app_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(app_requests_total[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Доля 5xx выше 5% за 5 минут"
          description: "Текущая доля 5xx: {{ $value | printf \"%.2f\" }}%."

      - alert: PostgresConnectionsHigh
        expr: |
          (
            pg_stat_database_numbackends{datname="appdb"}
            /
            pg_settings_max_connections
          ) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Соединения к PostgreSQL > 80% от max_connections"
          description: "Использовано {{ $value | printf \"%.1f\" }}% соединений."
